name: Build Check

# Trigger the check on any pull request targeting the main branch
on:
  pull_request:
    branches: [ main ]

jobs:
  verify-build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-node-version: '20'

    - name: Install dependencies
      run: npm ci

    - name: Run build script
      run: npm run build
